<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Q&amp;A · Lavkush</title>
  <link rel="icon" type="image/svg+xml" href="../images/icons/favicon.svg">
  <link rel="alternate icon" type="image/png" href="../images/icons/favicon-32x32.png">
  <script>try{document.documentElement.setAttribute("data-theme",localStorage.getItem("theme")||"red-graphite")}catch(e){}</script>
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11/styles/github-dark.min.css">
  <style>
    html { scroll-behavior: smooth; }
    .qna-layout { display: grid; grid-template-columns: 260px 1fr; gap: 2em; align-items: start; }
    .qna-toc { position: sticky; top: 1em; max-height: calc(100vh - 2em); overflow-y: auto;
      font-size: .88em; padding-right: .5em; border-right: 1px solid var(--border, #ddd); }
    .qna-toc a { display: block; padding: .2em 0; text-decoration: none; color: inherit; opacity: .8; }
    .qna-toc a:hover { opacity: 1; color: var(--accent, #b23); }
    .qna-toc a.tsec { font-weight: 600; margin-top: .8em; opacity: 1; }
    /* offset anchor jumps so headings aren't hidden under the topbar */
    :target { scroll-margin-top: 1.2em; }
    @media (max-width: 820px) {
      .qna-layout { grid-template-columns: 1fr; }
      .qna-toc { position: static; max-height: none; border-right: none;
        border-bottom: 1px solid var(--border, #ddd); margin-bottom: 1.5em; padding-bottom: 1em; }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <span class="tb-name"><span class="mark">❡</span> Lavkush</span>
  </div>

  <div class="layout">
    <main>
      <p style="margin-bottom:1.2em"><a href="index.html">← All Q&amp;A volumes</a></p>
      <div class="qna-layout">
        <nav class="qna-toc" id="toc"></nav>
        <article>
          <h1 id="post-title">Loading…</h1>
          <div id="post-body"></div>
        </article>
      </div>
      <div class="page-foot">© <span id="yr"></span> Lavkush Gupta</div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11/lib/highlight.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
  <script>
    if (window.mermaid) {
      var darkThemes = ["charcoal", "solarized-dark", "dracula", "gotham"];
      var t = document.documentElement.getAttribute("data-theme") || "";
      mermaid.initialize({ startOnLoad: false, securityLevel: "loose",
        theme: darkThemes.indexOf(t) !== -1 ? "dark" : "neutral" });
    }
  </script>
  <script>
    document.getElementById("yr").textContent = new Date().getFullYear();

    var titleEl = document.getElementById("post-title");
    var bodyEl = document.getElementById("post-body");
    var tocEl = document.getElementById("toc");

    var file = new URLSearchParams(location.search).get("p");
    // only allow simple filenames in the same folder — no traversal
    if (!file || !/^[A-Za-z0-9._-]+\.md$/.test(file)) {
      titleEl.textContent = "Not found";
      bodyEl.innerHTML = "<p>Invalid or missing page.</p>";
    } else {
      // give marked deterministic, slug-style heading ids we can link to
      var slug = function (s) {
        return s.toLowerCase().trim()
          .replace(/[^\w\s-]/g, "").replace(/\s+/g, "-").replace(/-+/g, "-");
      };
      fetch(file, { cache: "no-store" })
        .then(function (r) { if (!r.ok) throw new Error("missing"); return r.text(); })
        .then(function (md) {
          bodyEl.innerHTML = window.marked ? marked.parse(md) : "<pre>" + md + "</pre>";

          // Assign ids to every heading, then build a TOC of the question headings.
          var used = {};
          var heads = bodyEl.querySelectorAll("h1, h2, h3, h4");
          var tocItems = [];
          heads.forEach(function (h) {
            var text = h.textContent;
            var id = slug(text) || "sec";
            if (used[id]) { used[id]++; id = id + "-" + used[id]; } else { used[id] = 1; }
            h.id = id;

            // Section headers (Part / A. / letter groups) and questions go in the TOC.
            if (/^Q\d+[\.\:]/.test(text)) {
              tocItems.push({ id: id, text: text, sec: false });
            } else if (/^(Part\b|[A-G]\.)/.test(text) || (h.tagName === "H1" && tocItems.length)) {
              tocItems.push({ id: id, text: text, sec: true });
            }
          });

          // page title = first H1
          var h1 = bodyEl.querySelector("h1");
          titleEl.textContent = h1 ? h1.textContent : "Q&A";
          if (h1) h1.remove();
          document.title = titleEl.textContent + " · Lavkush";

          tocEl.innerHTML = tocItems.map(function (it) {
            return '<a class="' + (it.sec ? "tsec" : "") + '" href="#' + it.id + '">' +
              it.text + "</a>";
          }).join("");

          // Mermaid diagrams
          if (window.mermaid) {
            bodyEl.querySelectorAll("pre code.language-mermaid").forEach(function (block) {
              var div = document.createElement("div");
              div.className = "mermaid";
              div.textContent = block.textContent;
              block.parentElement.replaceWith(div);
            });
            try { mermaid.run({ querySelector: ".mermaid" }); } catch (e) {}
          }
          // Syntax highlighting
          if (window.hljs) {
            bodyEl.querySelectorAll("pre code").forEach(function (block) {
              if (block.classList.contains("language-mermaid")) return;
              try { hljs.highlightElement(block); } catch (e) {}
            });
          }
        })
        .catch(function () {
          titleEl.textContent = "Not found";
          bodyEl.innerHTML = "<p>Could not load this page.</p>";
        });
    }
  </script>
</body>
</html>
