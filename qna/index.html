<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Q&amp;A · Lavkush</title>
  <link rel="icon" type="image/svg+xml" href="../images/icons/favicon.svg">
  <link rel="alternate icon" type="image/png" href="../images/icons/favicon-32x32.png">
  <script>try{document.documentElement.setAttribute("data-theme",localStorage.getItem("theme")||"red-graphite")}catch(e){}</script>
  <link rel="stylesheet" href="../style.css">
  <style>
    .qna-list { list-style: none; padding: 0; margin: 1.5em 0; }
    .qna-card { display: block; padding: 1.1em 1.3em; margin-bottom: 1em;
      border: 1px solid var(--border, #ddd); border-radius: 10px;
      text-decoration: none; color: inherit; transition: border-color .15s, transform .15s; }
    .qna-card:hover { border-color: var(--accent, #b23); transform: translateY(-1px); }
    .qna-card h3 { margin: 0 0 .35em; }
    .qna-card p { margin: 0; opacity: .75; font-size: .92em; }
  </style>
</head>
<body>
  <div class="topbar">
    <span class="tb-name"><span class="mark">❡</span> Lavkush</span>
  </div>

  <div class="layout">
    <main>
      <article>
        <h1>Q&amp;A</h1>
        <p style="opacity:.7">Private interview-prep volumes. Unlisted — not linked from the blog.</p>
        <ul class="qna-list" id="qna-list"><li>Loading…</li></ul>
      </article>
      <div class="page-foot">© <span id="yr"></span> Lavkush Gupta</div>
    </main>
  </div>

  <script>
    document.getElementById("yr").textContent = new Date().getFullYear();
    var listEl = document.getElementById("qna-list");
    fetch("posts.json", { cache: "no-store" })
      .then(function (r) { if (!r.ok) throw new Error("missing"); return r.json(); })
      .then(function (posts) {
        listEl.innerHTML = posts.map(function (p) {
          return '<li><a class="qna-card" href="post.html?p=' + encodeURIComponent(p.file) + '">' +
            '<h3>' + p.title + '</h3>' +
            (p.summary ? '<p>' + p.summary + '</p>' : '') +
            '</a></li>';
        }).join("");
      })
      .catch(function () { listEl.innerHTML = "<li>Could not load the list.</li>"; });
  </script>
</body>
</html>
