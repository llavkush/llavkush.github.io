name: Validate posts & build feed

on:
  push:
    branches: [Master]
    paths:
      - "posts/**"
      - "scripts/**"
      - ".github/workflows/posts.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: posts-feed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate posts.json against markdown files
        run: node scripts/validate-posts.mjs

      - name: Build RSS feed
        run: node scripts/build-feed.mjs

      - name: Commit feed.xml if it changed
        run: |
          if git diff --quiet -- feed.xml; then
            echo "feed.xml unchanged."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add feed.xml
            git commit -m "chore: rebuild RSS feed [skip ci]"
            git push
          fi
