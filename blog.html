<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script defer src="scripts/analytics.js"></script>
  <title>Blog · Lavkush</title>
  <meta name="description" content="Posts, case studies and notes by Lavkush Gupta.">
  <link rel="icon" type="image/svg+xml" href="images/icons/favicon.svg">
  <link rel="alternate icon" type="image/png" href="images/icons/favicon-32x32.png">
  <script>try{document.documentElement.setAttribute("data-theme",localStorage.getItem("theme")||"red-graphite")}catch(e){}</script>
  <link rel="stylesheet" href="style.css">
  <link rel="alternate" type="application/rss+xml" title="Lavkush Gupta — Blog" href="feed.xml">
</head>
<body>
  <div class="topbar">
    <button class="nav-toggle" onclick="toggleNav()" aria-label="Open navigation">☰</button>
    <span class="tb-name"><span class="mark">❡</span> Lavkush</span>
  </div>
  <div class="scrim" onclick="closeNav()"></div>

  <div class="layout">
    <aside class="sidebar" id="sidebar"></aside>
    <main>
      <h1 id="blog-h1">Blog</h1>
      <p class="muted" id="blog-sub">Sections, series and field notes.</p>
      <div id="blog-body"></div>

      <div class="page-foot">© <span id="yr"></span> Lavkush Gupta</div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="app.js"></script>
  <script>
    document.getElementById("yr").textContent = new Date().getFullYear();
    var params = new URLSearchParams(location.search);
    var tag = params.get("tag");
    var series = params.get("series");
    var category = params.get("category");
    var h1 = document.getElementById("blog-h1");
    var sub = document.getElementById("blog-sub");
    var esc = function (s) { return s.replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); };

    if (series) {
      h1.textContent = series;
      sub.innerHTML = '<a href="blog.html">← all sections</a>';
      document.title = series + " · Lavkush";
      renderNoteList("#blog-body", { series: series });
    } else if (category) {
      h1.textContent = category;
      sub.innerHTML = '<a href="blog.html">← all sections</a>';
      document.title = category + " · Lavkush";
      renderBlogIndex("#blog-body", { category: category });
    } else if (tag) {
      h1.innerHTML = 'Tagged <span class="tag">' + esc(tag) + "</span>";
      sub.innerHTML = '<a href="blog.html">← all posts</a>';
      document.title = "#" + tag + " · Lavkush";
      renderNoteList("#blog-body", { tag: tag });
    } else {
      renderBlogIndex("#blog-body");
    }
  </script>
</body>
</html>
